<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>calculator</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="./script.js"></script>
    <style></style>
  </head>
  <body class="d-flex justify-content-center align-items-center bg-warning" style="height: 100vh;">
    <div class="calculator bg-primary rounded p-2 shadow " style="width: 250px;">
      <h1 class="text-center">
        Calculator
      </h1>
      <div class="key-row d-flex gap-1  my-1">
        <input type="text" id="display" readonly class="w-100 rounded p-2" />
      </div>
      <div class="key-row d-flex gap-1  my-1">
        <button class="p-2 rounded col" onclick="display(7)">7</button>
        <button class="p-2 rounded col" onclick="display(8)">8</button>
        <button class="p-2 rounded col" onclick="display(9)">9</button>
        <button class="p-2 rounded col" onclick="display('*')">*</button>
      </div>
      <div class="key-row d-flex gap-1  my-1">
        <button class="p-2 rounded col" onclick="display(4)">4</button>
        <button class="p-2 rounded col" onclick="display(5)">5</button>
        <button class="p-2 rounded col" onclick="display(6)">6</button>
        <button class="p-2 rounded col" onclick="display('-')">-</button>
      </div>
      <div class="key-row d-flex gap-1  my-1">
        <button class="p-2 rounded col" onclick="display(1)">1</button>
        <button class="p-2 rounded col" onclick="display(2)">2</button>
        <button class="p-2 rounded col" onclick="display(3)">3</button>
        <button class="p-2 rounded col" onclick="display('+')">+</button>
      </div>

      <div class="key-row d-flex gap-1  my-1">
        <button class="p-2 rounded col action" onclick="clearD()">AC</button>
        <button class="p-2 rounded col" onclick="display(0)">0</button>
        <button class="p-2 rounded col" onclick="display('/')">/</button>
        <button class="p-2 rounded col" onclick="op()">=</button>
      </div>

      <div class="d-flex">
        <button class=" col delete py-1 rounded " onclick="back()">Delete</button>
      </div>
    </div>
  </body>
</html>
